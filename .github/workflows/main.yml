name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:     

env:
  DOCKER_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
  IMAGE_NAME: personal-website

jobs:
  # Job1: 构建并推送镜像
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job2: 部署到服务器
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 传输 compose 文件和 todo-app 到服务器
      - name: Copy files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HOST_SERVER }}
          port: 22
          username: ${{ secrets.HOST_USER_NAME }}
          key: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml, todo-app"
          target: "/home/ubuntu/lab12-final-project"
          strip_components: 0

      # SSH 登录服务器，执行部署
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.HOST_SERVER }}
          port: 22
          username: ${{ secrets.HOST_USER_NAME }}
          key: ${{ secrets.HOST_SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/lab12-final-project
            # 登录Docker Hub
            echo ${{ secrets.DOCKER_HUB_TOKEN }} | docker login --username ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
            # 停止旧容器
            docker compose down
            # 拉取最新镜像
            docker compose pull
            # 后台启动所有服务
            docker compose up -d --remove-orphans
            # 清理冗余镜像
            docker system prune -af --filter "until=24h"
